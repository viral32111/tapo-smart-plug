name: CI

on:
  push:
    paths:
      - '*/**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/*.yml
    branches:
      - '**'
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  PROJECT_TITLE: Tapo Smart Plugs
  PROJECT_NAME: tapo-smart-plugs

  ENTRY_POINT: ./cmd/tapo/main.go

  DOCKER_REGISTRY_DOMAIN: ghcr.io
  DOCKER_IMAGE_NAME: tapo-smart-plugs

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ 'linux', 'windows' ]
        arch: [ 'amd64', '386', 'arm64', 'arm' ]
        exclude:
          # 32-bit ARM is not supported on Windows
          - os: windows
            arch: arm
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Construct artifact & executable name
        id: names
        env:
          NAME: ${{ env.PROJECT_NAME }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        uses: actions/github-script@v9
        with:
          script: |
            const { NAME, OS, ARCH } = process.env;

            const artifactName = [ NAME, OS, ARCH ]
              .filter( value => value != '' )
              .join( '-' );

            const executableName = artifactName + ( OS == 'windows' ? '.exe' : '' );

            core.setOutput( 'artifact', artifactName );
            core.setOutput( 'executable', executableName );

      - name: Build executable
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_SHA::7}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          fi

          go build -v -ldflags="-s -w -X main.VERSION=${VERSION}" -o ${{ steps.names.outputs.executable }} ${{ env.ENTRY_POINT }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ steps.names.outputs.executable }}

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && !startsWith( github.ref_name, 'dependabot/' ) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY_DOMAIN }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: ${{ env.PROJECT_NAME }}-linux-*
          path: artifact

      - name: Create metadata for Docker image
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY_DOMAIN }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
          labels: |
            org.opencontainers.image.title=${{ env.PROJECT_TITLE }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            com.docker.extension.publisher-url=https://viral32111.com

      - name: Build & push Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' && !startsWith( github.ref_name, 'dependabot/' ) }}
          file: Dockerfile
          context: artifact
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          no-cache: true
          pull: true

      - name: Delete stale Docker images
        if: ${{ github.event_name != 'pull_request' && !startsWith( github.ref_name, 'dependabot/' ) }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ env.DOCKER_IMAGE_NAME }}
          delete-untagged: true
          delete-partial-images: true
          delete-orphaned-images: true
          delete-ghost-images: true
          exclude-tags: latest
          validate: true

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Move executables
        run: |
          mv -v artifacts/${{ env.PROJECT_NAME }}-*/${{ env.PROJECT_NAME }}-* ./
          rm -v -r artifacts

      - name: Calculate checksums
        run: |
          md5sum ${{ env.PROJECT_NAME }}-* > MD5SUMS.txt
          sha1sum ${{ env.PROJECT_NAME }}-* > SHA1SUMS.txt
          sha256sum ${{ env.PROJECT_NAME }}-* > SHA256SUMS.txt
          sha512sum ${{ env.PROJECT_NAME }}-* > SHA512SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.PROJECT_NAME }}-*
            *SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
